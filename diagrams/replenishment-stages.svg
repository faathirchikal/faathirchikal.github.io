<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404" width="520" height="404" role="img" aria-label="Four stages, each feeding the next: standard stock, shipment need, allocation, transport. A planner can override the figure at every stage, and the override is kept beside the engine's figure.">
<title>Four stages, each feeding the next: standard stock, shipment need, allocation, transport. A planner can override the figure at every stage, and the override is kept beside the engine's figure.</title>
<style>
text{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-size:14px;fill:#141414}
.m{fill:#555049}.s{font-size:12.5px}.b{font-weight:700}
.box{fill:none;stroke:#141414;stroke-width:1.5}
.hl{fill:#f6c800;stroke:#141414;stroke-width:1.5}
.ln{fill:none;stroke:#141414;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ar{fill:#141414}
.cell{fill:none;stroke:#8a857c;stroke-width:1}
@media (prefers-color-scheme:dark){
text{fill:#ece9e2}.m{fill:#a8a399}
.box,.ln{stroke:#ece9e2}.ar{fill:#ece9e2}.hl{stroke:#f6c800}.cell{stroke:#6b665e}
}
text.on{fill:#141414}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0 0L10 5L0 10z"/></marker></defs>
<rect x="20" y="8" width="300" height="56" class="box"/>
<text x="170.0" y="33.0" text-anchor="middle" class="b">1. Standard stock</text>
<text x="170.0" y="50.0" text-anchor="middle" class="s m">days of cover × forecast daily demand</text>
<line x1="170" y1="64" x2="170" y2="107" class="ln" marker-end="url(#a)"/>
<text x="182" y="90.0" text-anchor="start" class="s m">units to hold</text>
<rect x="20" y="108" width="300" height="56" class="box"/>
<text x="170.0" y="133.0" text-anchor="middle" class="b">2. Shipment need</text>
<text x="170.0" y="150.0" text-anchor="middle" class="s m">standard stock − pending supply, in cartons</text>
<line x1="170" y1="164" x2="170" y2="207" class="ln" marker-end="url(#a)"/>
<text x="182" y="190.0" text-anchor="start" class="s m">units to ship</text>
<rect x="20" y="208" width="300" height="56" class="box"/>
<text x="170.0" y="233.0" text-anchor="middle" class="b">3. Allocation</text>
<text x="170.0" y="250.0" text-anchor="middle" class="s m">committed orders, then even days of cover</text>
<line x1="170" y1="264" x2="170" y2="307" class="ln" marker-end="url(#a)"/>
<text x="182" y="290.0" text-anchor="start" class="s m">units allocated</text>
<rect x="20" y="308" width="300" height="56" class="box"/>
<text x="170.0" y="333.0" text-anchor="middle" class="b">4. Transport</text>
<text x="170.0" y="350.0" text-anchor="middle" class="s m">OR-Tools routing, then bin packing</text>
<rect x="400" y="8" width="100" height="356" class="hl"/>
<text x="450.0" y="164.0" text-anchor="middle" class="b on">Planner</text>
<text x="450.0" y="184.0" text-anchor="middle" class="s on">accepts,</text>
<text x="450.0" y="200.0" text-anchor="middle" class="s on">changes</text>
<text x="450.0" y="216.0" text-anchor="middle" class="s on">or skips</text>
<line x1="400" y1="36.0" x2="321" y2="36.0" class="ln" marker-end="url(#a)"/>
<line x1="400" y1="136.0" x2="321" y2="136.0" class="ln" marker-end="url(#a)"/>
<line x1="400" y1="236.0" x2="321" y2="236.0" class="ln" marker-end="url(#a)"/>
<line x1="400" y1="336.0" x2="321" y2="336.0" class="ln" marker-end="url(#a)"/>
<text x="360.0" y="29.0" text-anchor="middle" class="s m">override</text>
</svg>
