<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-label="Sweep: every pair of departure time and fleet size is one routing solve. The chosen plan fixes the departure, and each stop's dose is back-solved from that anchor through the decay curve.">
