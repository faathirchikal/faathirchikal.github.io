<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-label="Request path: the routing agent signs a token with the user's access rights; the model only fills a JSON spec; the semantic layer, a SQL check and a SQL guard each apply the token before the warehouse returns rows.">
<title>Request path: the routing agent signs a token with the user's access rights; the model only fills a JSON spec; the semantic layer, a SQL check and a SQL guard each apply the token before the warehouse returns rows.</title>
<style>
text{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-size:14px;fill:#141414}
.m{fill:#555049}.s{font-size:12.5px}.b{font-weight:700}
.box{fill:none;stroke:#141414;stroke-width:1.5}
.hl{fill:#f6c800;stroke:#141414;stroke-width:1.5}
.ln{fill:none;stroke:#141414;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ar{fill:#141414}
.cell{fill:none;stroke:#8a857c;stroke-width:1}
@media (prefers-color-scheme:dark){
text{fill:#ece9e2}.m{fill:#a8a399}
.box,.ln{stroke:#ece9e2}.ar{fill:#ece9e2}.hl{stroke:#f6c800}.cell{stroke:#6b665e}
}
text.on{fill:#141414}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0 0L10 5L0 10z"/></marker></defs>
<rect x="20" y="8" width="280" height="48" class="box"/>
<text x="160.0" y="37.0" text-anchor="middle" class="b">User question</text>
<line x1="160" y1="56" x2="160" y2="81" class="ln" marker-end="url(#a)"/>
<rect x="20" y="82" width="280" height="48" class="box"/>
<text x="160.0" y="103.0" text-anchor="middle" class="b">Routing agent</text>
<text x="160.0" y="120.0" text-anchor="middle" class="s m">only agents the user's roles reach</text>
<line x1="160" y1="130" x2="160" y2="155" class="ln" marker-end="url(#a)"/>
<rect x="20" y="156" width="280" height="48" class="box"/>
<text x="160.0" y="177.0" text-anchor="middle" class="b">Domain agent (LLM)</text>
<text x="160.0" y="194.0" text-anchor="middle" class="s m">fills a JSON spec, never SQL</text>
<line x1="160" y1="204" x2="160" y2="229" class="ln" marker-end="url(#a)"/>
<rect x="20" y="230" width="280" height="48" class="box"/>
<text x="160.0" y="251.0" text-anchor="middle" class="b">Spec validators</text>
<text x="160.0" y="268.0" text-anchor="middle" class="s m">declared fields only, units, stock metrics</text>
<line x1="160" y1="278" x2="160" y2="303" class="ln" marker-end="url(#a)"/>
<rect x="20" y="304" width="280" height="48" class="hl"/>
<text x="160.0" y="325.0" text-anchor="middle" class="b on">Semantic layer (Cube)</text>
<text x="160.0" y="342.0" text-anchor="middle" class="s on">adds the access filters</text>
<line x1="160" y1="352" x2="160" y2="377" class="ln" marker-end="url(#a)"/>
<rect x="20" y="378" width="280" height="48" class="hl"/>
<text x="160.0" y="399.0" text-anchor="middle" class="b on">Backend SQL check</text>
<text x="160.0" y="416.0" text-anchor="middle" class="s on">a condition on every restricted axis</text>
<line x1="160" y1="426" x2="160" y2="451" class="ln" marker-end="url(#a)"/>
<rect x="20" y="452" width="280" height="48" class="hl"/>
<text x="160.0" y="473.0" text-anchor="middle" class="b on">SQL guard</text>
<text x="160.0" y="490.0" text-anchor="middle" class="s on">plain SELECT, declared joins only</text>
<line x1="160" y1="500" x2="160" y2="525" class="ln" marker-end="url(#a)"/>
<text x="172" y="517.0" text-anchor="start" class="s m">rows only if all three pass</text>
<rect x="20" y="526" width="280" height="48" class="box"/>
<text x="160.0" y="555.0" text-anchor="middle" class="b">Warehouse</text>
<rect x="340" y="82" width="160" height="48" class="box"/>
<text x="420.0" y="103.0" text-anchor="middle" class="b">Signed token</text>
<text x="420.0" y="120.0" text-anchor="middle" class="s m">user's access rights</text>
<line x1="300" y1="106.0" x2="339" y2="106.0" class="ln" marker-end="url(#a)"/>
<text x="320.0" y="99.0" text-anchor="middle" class="s m">signs</text>
<line x1="420.0" y1="130" x2="420.0" y2="476.0" class="ln dash"/>
<line x1="420.0" y1="328.0" x2="301" y2="328.0" class="ln dash" marker-end="url(#a)"/>
<line x1="420.0" y1="402.0" x2="301" y2="402.0" class="ln dash" marker-end="url(#a)"/>
<line x1="420.0" y1="476.0" x2="301" y2="476.0" class="ln dash" marker-end="url(#a)"/>
<text x="428.0" y="176.0" text-anchor="start" class="s m">the model</text>
<text x="428.0" y="192.0" text-anchor="start" class="s m">never sees it</text>
</svg>
