<svg viewBox="0 0 720 240" role="img" aria-label="Four stages per branch and product: standard stock, shipment need, fair allocation of scarce stock, and truck routing. Planners can override every figure.">
  <title>Standard stock, then shipment need, then fair allocation, then transport, with a planner override at each stage.</title>
  <text x="20" y="26" class="il-t-acc">1  Standard stock</text><text x="20" y="44" class="il-t">days of cover × demand</text>
  <rect x="50" y="64" width="44" height="110" rx="5" class="il"/><path d="M42 92h60" class="il-acc"/><text x="108" y="96" class="il-t-acc">target</text>
  <rect x="53" y="130" width="38" height="41" rx="3" class="il-fill"/>
  <path d="M160 120h28" class="il"/><path d="M180 114l8 6-8 6" class="il"/>
  <text x="200" y="26" class="il-t-acc">2  Shipment need</text><text x="200" y="44" class="il-t">target minus stock</text><text x="200" y="60" class="il-t">on hand and on the way</text>
  <rect x="230" y="64" width="44" height="110" rx="5" class="il"/><path d="M222 92h60" class="il-acc"/>
  <rect x="233" y="130" width="38" height="41" rx="3" class="il-fill"/><rect x="233" y="112" width="38" height="16" rx="3" class="il-soft il-dash"/>
  <path d="M290 94v34" class="il-acc"/><path d="M285 102l5-8 5 8" class="il-acc"/><text x="298" y="116" class="il-t-acc">ship</text>
  <path d="M340 120h28" class="il"/><path d="M360 114l8 6-8 6" class="il"/>
  <text x="380" y="26" class="il-t-acc">3  Allocation</text><text x="380" y="44" class="il-t">short stock: raise all</text><text x="380" y="60" class="il-t">to one level</text>
  <g class="il"><rect x="384" y="64" width="30" height="110" rx="4"/><rect x="424" y="64" width="30" height="110" rx="4"/><rect x="464" y="64" width="30" height="110" rx="4"/></g>
  <rect x="386" y="140" width="26" height="32" rx="2" class="il-fill"/><rect x="426" y="110" width="26" height="62" rx="2" class="il-fill"/><rect x="466" y="156" width="26" height="16" rx="2" class="il-fill"/>
  <path d="M378 118h122" class="il-acc il-dash"/>
  <path d="M520 120h28" class="il"/><path d="M540 114l8 6-8 6" class="il"/>
  <text x="560" y="26" class="il-t-acc">4  Transport</text><text x="560" y="44" class="il-t">routes drop low-priority</text><text x="560" y="60" class="il-t">freight first</text>
  <path d="M566 150V104l20-14 20 14v46z" class="il"/>
  <path d="M606 136C640 136 640 80 670 80S700 140 680 160 620 170 606 146" class="il-acc"/>
  <g class="il-ground"><rect x="660" y="70" width="18" height="18" rx="4"/><rect x="684" y="128" width="18" height="18" rx="4"/><rect x="640" y="158" width="18" height="18" rx="4"/></g>
  <text x="20" y="214" class="il-t">Every figure carries a plain-language reason, and a planner can override it.</text>
</svg>
