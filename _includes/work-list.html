<ul class="departures">
  <li class="heads" aria-hidden="true"><span>Status</span><span>Project</span></li>
{%- assign work = site.work | sort: "order" -%}
{%- for item in work %}
  <li>
    <span class="status">{{ item.status }}</span>
    <div>
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      <p>{{ item.summary }}</p>
    </div>
  </li>
{%- endfor %}
</ul>
